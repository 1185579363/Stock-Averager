<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>股票平均价格计算器</title>
  <script>
    const themeStorageKey = 'stock-average-calculator.theme';
    try {
      if (localStorage.getItem(themeStorageKey) === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch {
      // Default to light when browser storage is unavailable.
    }
  </script>
  <style>
    :root {
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color-scheme: light;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --page: #f8f9fa;
      --surface: #ffffff;
      --surface-soft: #f1f3f5;
      --ink: #1f2937;
      --muted: #626b78;
      --line: #e5e7eb;
      --control-line: #858c98;
      --gold: #b48524;
      --gold-text: #8c6415;
      --gold-glow: #b4852426;
      --gold-line: #d4b46a;
      --gold-surface: #fdfaf2;
      --gold-hover: #f7efd9;
      --gold-pressed: #efe3c3;
      --danger: #923d38;
      --danger-soft: #fbefec;
      --danger-hover: #f4dfda;
      --shadow: #0000000d;
      --popover-shadow: #0000001f;
      --backdrop: #1f29376b;
      --button-shadow: 0 2px 8px #b48c3226;
      --page-glow: var(--gold-glow);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #09090b;
      --surface: #121214;
      --surface-soft: #18181b;
      --ink: #f4f4f5;
      --muted: #a1a1aa;
      --line: #27272a;
      --control-line: #6a6a73;
      --gold: #e6c875;
      --gold-text: #e6c875;
      --gold-glow: #e6c87526;
      --gold-line: #e6c87580;
      --gold-surface: #28231a;
      --gold-hover: #352e20;
      --gold-pressed: #3f3625;
      --danger: #f3a2a0;
      --danger-soft: #321e21;
      --danger-hover: #44262a;
      --shadow: #00000066;
      --popover-shadow: #00000080;
      --backdrop: #09090bb3;
      --button-shadow: inset 0 1px 0 #ffffff1a, 0 4px 12px #0000004d;
      --page-glow: #d4af370d;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      display: grid; place-items: center; min-height: 100vh; min-height: 100dvh;
      margin: 0; padding: clamp(12px, 4vw, 32px) 12px;
      color: var(--ink);
      background-color: var(--page);
      background-image: radial-gradient(circle at 50% 0%, var(--page-glow), transparent 50%);
    }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: default; opacity: .48; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--gold-text);
      outline-offset: 2px;
    }
    main { display: grid; gap: 2rem; width: min(100%, 740px); min-width: 0; }
    .calculator {
      border: 1px solid var(--line); border-radius: 18px; background: var(--surface);
      box-shadow: 0 4px 20px var(--shadow);
    }
    .page-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 12px; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line);
    }
    .page-heading { display: grid; gap: .4rem; min-width: 0; }
    h1, h2, p { margin: 0; }
    h1 {
      display: flex; align-items: center; gap: .75rem;
      font-size: 1.5rem; line-height: 1.25; font-weight: 600;
    }
    h1::before { content: ''; flex: 0 0 4px; height: 20px; border-radius: 2px; background: var(--gold); }
    .page-subtitle {
      margin-left: 1rem; color: var(--muted); font-size: .75rem; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
    }
    h2 { font-size: 20px; }
    .theme-toggle {
      position: relative; display: flex; align-items: center; justify-content: space-between;
      flex: 0 0 76px; height: 34px; padding: 3px; border: 1px solid var(--line);
      border-radius: 50px; background: var(--surface-soft); box-shadow: inset 0 2px 4px var(--shadow);
      user-select: none;
    }
    .theme-icon {
      position: relative; display: grid; width: 26px; height: 26px; place-items: center;
      font: 14px/1 "Segoe UI Symbol", sans-serif; transition: opacity .4s ease;
    }
    .theme-slider {
      position: absolute; inset: 3px auto auto 3px; width: 26px; height: 26px; border-radius: 50%;
      background: var(--surface); box-shadow: 0 2px 5px var(--shadow);
      transition: transform .5s cubic-bezier(.25, .8, .25, 1);
    }
    .theme-sun { color: #f59e0b; }
    .theme-moon { color: #818cf8; opacity: .4; }
    [data-theme="dark"] .theme-slider { transform: translateX(42px); }
    [data-theme="dark"] .theme-sun { opacity: .4; }
    [data-theme="dark"] .theme-moon { opacity: 1; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 2; animation: theme-reveal 2.2s cubic-bezier(.2, .8, .2, 1) forwards; }
    @keyframes theme-reveal {
      from { clip-path: circle(0% at var(--theme-x, 50%) var(--theme-y, 50%)); }
      to { clip-path: circle(150% at var(--theme-x, 50%) var(--theme-y, 50%)); }
    }
    @media (prefers-reduced-motion: no-preference) {
      body { transition: background-color 1s ease, color 1s ease; }
      .theme-fade body { transition-duration: 1.2s; }
      .calculator, .page-header, .page-subtitle, thead, tbody tr, tbody th, tfoot, .operator, .number, .dialog-input,
      .button, .saved-list, summary, .popover, .subtotal-edit, .remove, .theme-toggle,
      .totals, .totals > div, .totals dt, .totals dd, dialog {
        transition: background-color 1s ease, border-color 1s ease, color 1s ease, box-shadow 1s ease;
      }
      .primary { transition-duration: .2s; }
    }
    @media (prefers-reduced-motion: reduce) {
      .theme-icon, .theme-slider { transition: none; }
      ::view-transition-new(root) { animation: none; }
    }
    .entry { padding: clamp(12px, 3.6vw, 26px); }
    #active-name { margin-bottom: 12px; font-weight: 650; overflow-wrap: anywhere; }
    .ledger { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table, .totals { font-variant-numeric: tabular-nums; }
    .col-index { width: 9%; }
    .col-price { width: 25%; }
    .col-operator { width: 5%; }
    .col-quantity { width: 20%; }
    .col-subtotal { width: 28%; }
    .col-action { width: 8%; }
    th, td { padding: 7px 3px; text-align: center; }
    thead { background: var(--surface-soft); font-size: .875rem; }
    thead th { padding-block: 10px; white-space: nowrap; }
    tbody th { color: var(--muted); font-size: .875rem; font-weight: 600; }
    tbody tr { border-top: 1px solid var(--line); }
    tbody tr:focus-within { background: var(--gold-surface); }
    .operator { color: var(--muted); font-size: .9rem; }
    .number, .dialog-input {
      width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid var(--control-line);
      border-radius: 6px; background: var(--surface-soft); color: var(--ink);
    }
    .number, .value, .totals dd { font-family: var(--font-mono); }
    .number { text-align: right; font-variant-numeric: tabular-nums; }
    .number::placeholder { color: var(--muted); }
    .number:focus { border-color: var(--gold-text); box-shadow: 0 0 0 2px var(--gold-glow); }
    .number[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-soft); }
    .value { text-align: right; overflow-wrap: anywhere; padding-right: 5px; }
    .subtotal-edit {
      max-width: 100%; padding: 0 2px; border: 0; border-bottom: 1px dotted var(--gold-text);
      background: transparent; color: var(--gold-text); font: inherit; text-align: right; overflow-wrap: anywhere;
    }
    .subtotal-edit:hover { background: var(--gold-hover); }
    tfoot { border-top: 1px solid var(--line); background: var(--surface-soft); color: var(--ink); font-weight: 700; }
    tfoot td, tfoot th { padding-block: 9px; overflow-wrap: anywhere; }
    tfoot th { font-size: .75rem; }
    .remove {
      width: 28px; height: 30px; padding: 0; border: 0; border-radius: 6px;
      background: var(--danger-soft); color: var(--danger); line-height: 1; font-size: 18px;
    }
    .remove:hover { background: var(--danger-hover); }
    .toolbar {
      display: grid; grid-template-columns: auto minmax(0, 1fr); justify-items: start; align-items: start;
      gap: 8px 10px; margin-top: 14px;
    }
    .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; justify-self: end; }
    .button, .saved-list, summary {
      min-height: 37px; padding: 6px 10px; border: 1px solid var(--control-line); border-radius: 7px;
      background: var(--surface); color: var(--ink); font-size: .875rem; font-weight: 630;
    }
    .button:hover, summary:hover { background: var(--surface-soft); }
    .primary { border-color: var(--gold-line); background: var(--gold-surface); color: var(--gold-text); box-shadow: var(--button-shadow); }
    .primary:hover { border-color: var(--gold); background: var(--gold-hover); }
    .primary:active { background: var(--gold-pressed); box-shadow: none; }
    .saved-list { width: min(100%, 196px); justify-self: end; font-weight: 500; }
    .slot-menu { position: relative; }
    summary { list-style: none; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }
    .popover {
      position: absolute; z-index: 1; top: calc(100% + 6px); right: 0; width: 140px;
      padding: 4px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); box-shadow: 0 8px 24px var(--popover-shadow);
    }
    .popover button { display: block; width: 100%; padding: 7px 9px; border: 0; border-radius: 4px; background: transparent; color: var(--ink); text-align: left; font-size: .875rem; }
    .popover button:hover:not(:disabled) { background: var(--surface-soft); }
    .status { margin-top: 8px; font-size: .875rem; color: var(--muted); }
    .status:empty { display: none; }
    .totals {
      display: grid; grid-template-columns: 1.2fr 1fr 1fr; margin: 0;
      border-top: 1px solid var(--line); border-radius: 0 0 17px 17px; background: var(--surface-soft);
    }
    .totals > div { min-width: 0; padding: 15px clamp(8px, 3vw, 22px); }
    .totals > div + div { border-left: 1px solid var(--line); }
    .totals dt { margin-bottom: 2px; font-size: .875rem; color: var(--muted); }
    .totals dd { margin: 0; font-size: clamp(16px, 3.5vw, 27px); font-weight: 700; overflow-wrap: anywhere; }
    .totals > div:first-child { background: var(--gold-surface); border-radius: 0 0 0 17px; }
    .totals > div:first-child dd { color: var(--gold-text); text-shadow: 0 0 10px var(--gold-glow); }
    .totals > div:nth-child(2) { border-left-color: var(--gold-line); }
    dialog {
      width: min(440px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 22px;
      border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--surface);
    }
    dialog::backdrop { background: var(--backdrop); }
    .dialog-content { display: grid; gap: 12px; margin-top: 13px; overflow-wrap: anywhere; }
    .dialog-content label { display: grid; gap: 4px; }
    .dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 17px; }
    .dialog-error { color: var(--danger); font-size: .875rem; }
    .dialog-error:empty { display: none; }
    .order-list { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .order-list li { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; }
    @media (max-width: 600px) {
      main { gap: 1.2rem; }
      .page-header { align-items: center; padding-bottom: .75rem; }
      .page-heading { gap: .2rem; }
      h1 { gap: .5rem; font-size: 1.15rem; }
      h1::before { flex-basis: 3px; height: 15px; }
      .page-subtitle { margin-left: .7rem; font-size: .65rem; }
      .theme-toggle { transform: scale(.9); transform-origin: right center; }
    }
    @media (max-width: 420px) {
      th, td { padding-inline: 2px; }
      .col-index { width: 11%; }
      .col-subtotal { width: 26%; }
      .number { padding-inline: 4px; }
      .value, tfoot { font-size: .875rem; }
      .remove { width: 22px; }
      .toolbar .button, summary { padding-inline: 6px; }
      .unit-quantity { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <div class="page-heading">
        <h1 id="title">股票平均价格计算器</h1>
        <p class="page-subtitle" lang="en">Stock Average Price</p>
      </div>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="深色主题" aria-pressed="false" title="切换主题">
        <span class="theme-slider" aria-hidden="true"></span>
        <span class="theme-icon theme-sun" aria-hidden="true">☀︎</span>
        <span class="theme-icon theme-moon" aria-hidden="true">☾</span>
      </button>
    </header>
    <section class="calculator" aria-labelledby="title">
      <div class="entry">
        <p id="active-name" hidden></p>
        <div class="ledger">
          <table aria-label="买入明细">
            <colgroup>
              <col class="col-index"><col class="col-price"><col class="col-operator">
              <col class="col-quantity"><col class="col-operator"><col class="col-subtotal"><col class="col-action">
            </colgroup>
            <thead>
              <tr>
                <th scope="col" aria-label="序号"></th>
                <th scope="col">价格 <span class="currency-unit"></span></th>
                <th scope="col" aria-label="乘号"></th>
                <th scope="col">数量 <span class="unit-quantity">(n)</span></th>
                <th scope="col" aria-label="等号"></th>
                <th scope="col">小计 <span class="currency-unit"></span></th>
                <th scope="col" aria-label="行操作"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
            <tfoot>
              <tr><th scope="row">合计</th><td id="table-average">0</td><td>×</td><td id="table-quantity">0</td><td>=</td><td class="value" id="table-amount">0</td><td></td></tr>
            </tfoot>
          </table>
        </div>
        <div class="toolbar">
          <button class="button primary" id="add" type="button">＋ 添加行</button>
          <div class="actions">
            <button class="button" id="save" type="button">保存</button>
            <button class="button" id="reset" type="button" title="恢复当前记录上次保存的内容">重置</button>
            <details class="slot-menu" id="menu">
              <summary>更多 ▾</summary>
              <div class="popover">
                <button type="button" id="new">新建</button>
                <button type="button" id="save-as">另存为</button>
                <button type="button" id="delete">删除记录</button>
                <button type="button" id="order">调整顺序</button>
                <button type="button" id="export">导出</button>
              </div>
            </details>
          </div>
          <button class="button" id="settings" type="button">货币设置</button>
          <select class="saved-list" id="saved" aria-label="已保存的记录"></select>
        </div>
        <p id="status" class="status" role="status"></p>
      </div>
      <dl class="totals" aria-live="polite" aria-atomic="true">
        <div><dt>平均价格</dt><dd id="average">—</dd></div>
        <div><dt>总量</dt><dd id="quantity">—</dd></div>
        <div><dt>总金额</dt><dd id="amount">—</dd></div>
      </dl>
    </section>
  </main>
  <template id="row-template">
    <tr>
      <th scope="row"></th>
      <td><input class="number" type="text" inputmode="decimal" placeholder="价格" autocomplete="off" maxlength="66" data-field="price"></td>
      <td class="operator" aria-hidden="true">×</td>
      <td><input class="number" type="text" inputmode="decimal" placeholder="数量" autocomplete="off" maxlength="66" data-field="quantity"></td>
      <td class="operator" aria-hidden="true">=</td>
      <td class="value"><span class="subtotal"></span><button class="subtotal-edit" type="button" hidden></button></td>
      <td><button class="remove" type="button" hidden>×</button></td>
    </tr>
  </template>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div class="dialog-content" id="dialog-content"></div>
      <p class="dialog-error" id="dialog-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="button" id="dialog-cancel" type="button">取消</button>
        <button class="button" id="dialog-alternate" type="button" hidden></button>
        <button class="button primary" id="dialog-submit" type="submit"></button>
      </div>
    </form>
  </dialog>
  <script>
    'use strict';

    const byId = (id) => document.getElementById(id);
    const themeRoot = document.documentElement;
    const themeToggle = byId('theme-toggle');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let theme = themeRoot.dataset.theme;
    let themeTransition;

    function applyTheme() {
      themeRoot.dataset.theme = theme;
      themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
    }

    applyTheme();
    themeToggle.addEventListener('click', (event) => {
      theme = theme === 'dark' ? 'light' : 'dark';
      try {
        localStorage.setItem(themeStorageKey, theme);
      } catch {
        // The selected theme still works for this page load.
      }

      themeTransition?.skipTransition();
      if (typeof document.startViewTransition !== 'function' || reducedMotion.matches) {
        themeRoot.classList.toggle('theme-fade', !reducedMotion.matches);
        applyTheme();
        return;
      }

      const rect = themeToggle.getBoundingClientRect();
      const x = event.detail ? event.clientX : rect.left + rect.width / 2;
      const y = event.detail ? event.clientY : rect.top + rect.height / 2;
      themeRoot.style.setProperty('--theme-x', `${x}px`);
      themeRoot.style.setProperty('--theme-y', `${y}px`);
      themeTransition = document.startViewTransition(applyTheme);
      themeTransition.ready.catch(() => {});
    });

    const minimumRows = 4;
    const precision = 12;
    const scale = 10n ** BigInt(precision);
    const storageKey = 'stock-average-calculator.v1';
    const currencyOptions = [['auto', '自动（元）'], ['元', '元'], ['$', '$'], ['€', '€'], ['¥', '¥'], ['円', '円']];
    const numberFormats = {
      auto: { label: '自动（1,234,567.89）', group: ',', decimal: '.' },
      comma: { label: '1,234,567.89', group: ',', decimal: '.' },
      dot: { label: '1.234.567,89', group: '.', decimal: ',' },
      space: { label: '1 234 567,89', group: ' ', decimal: ',' },
      indian: { label: '12,34,567.89', group: ',', decimal: '.' }
    };
    const rowsElement = byId('rows');
    const savedSelect = byId('saved');
    const menu = byId('menu');
    const dialog = byId('dialog');
    const dialogContent = byId('dialog-content');
    const dialogError = byId('dialog-error');
    const alternate = byId('dialog-alternate');
    let submitDialog;
    let activeName = '';
    let storageAvailable = true;
    let data = { prefs: { currency: 'auto', format: 'auto' }, records: [] };

    function blankRow() {
      return { price: '', quantity: '' };
    }

    function validateRecords(records) {
      const number = /^(?:-?\d{1,30}(?:\.\d{1,12})?)?$/;
      const names = new Set();
      return Array.isArray(records) && records.every((record) => {
        if (!record || typeof record.name !== 'string' || !record.name.trim() ||
            record.name.length > 80 || names.has(record.name) || !Array.isArray(record.rows)) return false;
        names.add(record.name);
        return record.rows.length >= minimumRows && record.rows.every((row) =>
          row && typeof row.price === 'string' && typeof row.quantity === 'string' &&
          number.test(row.price) && number.test(row.quantity));
      });
    }

    try {
      const stored = JSON.parse(localStorage.getItem(storageKey));
      if (stored && validateRecords(stored.records)) {
        data.records = stored.records;
        const prefs = stored.prefs;
        if (prefs && currencyOptions.some(([code]) => code === prefs.currency) &&
            Object.hasOwn(numberFormats, prefs.format)) data.prefs = prefs;
      }
    } catch (error) {
      storageAvailable = error.name === 'SyntaxError';
    }

    function announce(message) {
      byId('status').textContent = message;
    }

    function persist(next) {
      try {
        localStorage.setItem(storageKey, JSON.stringify(next));
        data = next;
        storageAvailable = true;
        return true;
      } catch {
        const message = '浏览器无法保存到本地，请检查存储权限或可用空间。';
        if (dialog.open) dialogError.textContent = message;
        else announce(message);
        return false;
      }
    }

    function unit(prefs = data.prefs) {
      return prefs.currency === 'auto' ? '元' : prefs.currency;
    }

    function formatNumber(canonical, key = data.prefs.format) {
      if (canonical === '') return '';
      const { group, decimal } = numberFormats[key];
      const [integer, fraction] = canonical.split('.');
      const sign = integer.startsWith('-') ? '-' : '';
      const digits = sign ? integer.slice(1) : integer;
      const grouped = key === 'indian' && digits.length > 3
        ? digits.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, group) + group + digits.slice(-3)
        : digits.replace(/\B(?=(\d{3})+(?!\d))/g, group);
      return sign + grouped + (fraction ? decimal + fraction : '');
    }

    function parseNumber(raw, { maxInteger = 30, maxFraction = precision } = {}) {
      const value = raw.normalize('NFKC').trim().replace(/^−/, '-');
      if (value === '') return '';
      const key = data.prefs.format;
      const { group, decimal } = numberFormats[key];
      const [integer, fraction, extra] = value.split(decimal);
      if (extra !== undefined || (fraction !== undefined && (!/^\d*$/.test(fraction) || fraction.length > maxFraction))) return null;
      const plain = integer.replaceAll(group, '');
      if (integer.includes(group) && formatNumber(plain, key) !== integer) return null;
      if (!/^-?\d*$/.test(plain) || plain.replace('-', '').length > maxInteger || (!/\d/.test(plain) && !fraction)) return null;
      const negative = plain.startsWith('-');
      const whole = (negative ? plain.slice(1) : plain).replace(/^0+(?=\d)/, '') || '0';
      const decimals = fraction?.replace(/0+$/, '') || '';
      const sign = negative && (whole !== '0' || decimals) ? '-' : '';
      return sign + whole + (decimals ? '.' + decimals : '');
    }

    function formatMoney(value, prefs = data.prefs) {
      const formatted = formatNumber(value, prefs.format);
      const symbol = unit(prefs);
      if (symbol === '元' || symbol === '円') return `${formatted} ${symbol}`;
      return formatted.startsWith('-') ? `−${symbol}${formatted.slice(1)}` : symbol + formatted;
    }

    function asFixed(canonical, places = precision) {
      const negative = canonical.startsWith('-');
      const [integer, fraction = ''] = (negative ? canonical.slice(1) : canonical).split('.');
      const value = BigInt(integer + fraction.padEnd(places, '0'));
      return negative ? -value : value;
    }

    function asText(value, places, trim = true) {
      const negative = value < 0n;
      const digits = (negative ? -value : value).toString().padStart(places + 1, '0');
      if (places === 0) return (negative ? '-' : '') + digits;
      const decimal = digits.slice(-places);
      const fraction = trim ? decimal.replace(/0+$/, '') : decimal;
      return (negative ? '-' : '') + digits.slice(0, -places) + (fraction ? '.' + fraction : '');
    }

    function divideRounded(numerator, denominator) {
      const negative = (numerator < 0n) !== (denominator < 0n);
      const top = numerator < 0n ? -numerator : numerator;
      const bottom = denominator < 0n ? -denominator : denominator;
      const rounded = (top + bottom / 2n) / bottom;
      return negative ? -rounded : rounded;
    }

    function rowInputs(row) {
      return [row.querySelector('[data-field="price"]'), row.querySelector('[data-field="quantity"]')];
    }

    function appendRow(values = blankRow()) {
      const row = byId('row-template').content.firstElementChild.cloneNode(true);
      for (const input of rowInputs(row)) input.value = formatNumber(values[input.dataset.field]);
      rowsElement.append(row);
      return row;
    }

    function labelRows() {
      Array.from(rowsElement.rows).forEach((row, index) => {
        const position = index + 1;
        const [price, quantity] = rowInputs(row);
        const remove = row.querySelector('.remove');
        row.cells[0].textContent = position;
        price.setAttribute('aria-label', `第 ${position} 行价格`);
        quantity.setAttribute('aria-label', `第 ${position} 行数量`);
        row.querySelector('.subtotal-edit').setAttribute('aria-label', `编辑第 ${position} 行小计`);
        remove.setAttribute('aria-label', `删除第 ${position} 行`);
        remove.hidden = index < minimumRows;
      });
    }

    function readRows() {
      return Array.from(rowsElement.rows, (row) => {
        const [price, quantity] = rowInputs(row);
        return { price: parseNumber(price.value), quantity: parseNumber(quantity.value) };
      });
    }

    function calculate() {
      let totalQuantity = 0n;
      let totalAmount = 0n;
      let completeRows = 0;
      let inputPrecision = 0;
      const entries = readRows();
      entries.forEach(({ price, quantity }, index) => {
        const row = rowsElement.rows[index];
        const [priceInput, quantityInput] = rowInputs(row);
        priceInput.setAttribute('aria-invalid', String(price === null));
        quantityInput.setAttribute('aria-invalid', String(quantity === null));
        let subtotal = '';
        if (price && quantity) {
          const count = asFixed(quantity);
          const amount = asFixed(price) * count;
          totalQuantity += count;
          totalAmount += amount;
          completeRows += 1;
          inputPrecision = Math.max(inputPrecision, price.split('.')[1]?.length || 0, quantity.split('.')[1]?.length || 0);
          subtotal = formatNumber(asText(amount, 2 * precision));
        }
        const editable = price && price !== '0';
        const edit = row.querySelector('.subtotal-edit');
        edit.hidden = !editable;
        edit.textContent = editable ? subtotal || '填小计' : '';
        row.querySelector('.subtotal').textContent = editable ? '' : subtotal;
      });

      let average = '';
      if (totalQuantity !== 0n) {
        const amount = totalAmount < 0n ? -totalAmount : totalAmount;
        const count = totalQuantity < 0n ? -totalQuantity : totalQuantity;
        const defaultPlaces = amount < 100n * count * scale ? 4 : 2;
        const places = Math.max(defaultPlaces, inputPrecision);
        average = asText(divideRounded(totalAmount, totalQuantity * 10n ** BigInt(precision - places)), places, false);
      }

      const amount = asText(totalAmount, 2 * precision);
      const quantity = asText(totalQuantity, precision);
      byId('table-average').textContent = average ? formatNumber(average) : '0';
      byId('table-quantity').textContent = formatNumber(quantity);
      byId('table-amount').textContent = formatNumber(amount);
      byId('average').textContent = average ? formatMoney(average) : '—';
      byId('quantity').textContent = completeRows ? formatNumber(quantity) : '—';
      byId('amount').textContent = completeRows ? formatMoney(amount) : '—';
    }

    function recordFor(name = activeName) {
      return data.records.find((record) => record.name === name);
    }

    function refreshSaved() {
      savedSelect.replaceChildren(new Option(data.records.length ? '选择已保存记录' : '暂无已保存记录', ''));
      for (const record of data.records) savedSelect.add(new Option(record.name, record.name));
      savedSelect.value = activeName;
      savedSelect.disabled = data.records.length === 0;
      byId('delete').disabled = !activeName;
      byId('order').disabled = data.records.length < 2;
      const name = byId('active-name');
      name.textContent = activeName;
      name.hidden = !activeName;
    }

    function loadRecord(name = '') {
      activeName = name;
      const entries = recordFor(name)?.rows || Array.from({ length: minimumRows }, blankRow);
      rowsElement.replaceChildren();
      for (const entry of entries) appendRow(entry);
      labelRows();
      refreshSaved();
      calculate();
      announce('');
    }

    function openDialog({ title, body, action, onSubmit, secondary, onSecondary }) {
      byId('dialog-title').textContent = title;
      byId('dialog-submit').textContent = action;
      dialogContent.replaceChildren(...body);
      dialogError.textContent = '';
      submitDialog = onSubmit;
      alternate.hidden = !secondary;
      alternate.textContent = secondary || '';
      alternate.onclick = onSecondary || null;
      if (!dialog.open) dialog.showModal();
      (dialogContent.querySelector('input:not([type="file"]), select') || byId('dialog-cancel')).focus();
    }

    function paragraph(text) {
      const element = document.createElement('p');
      element.textContent = text;
      return element;
    }

    function field(label, control) {
      const element = document.createElement('label');
      control.classList.add('dialog-input');
      element.append(label, control);
      return element;
    }

    function editSubtotal(button) {
      const [price, quantity] = rowInputs(button.closest('tr'));
      const priceValue = asFixed(parseNumber(price.value));
      const quantityValue = parseNumber(quantity.value);
      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'decimal';
      if (quantityValue) input.value = formatNumber(asText(priceValue * asFixed(quantityValue), 2 * precision));
      openDialog({
        title: '按小计计算数量', body: [field('小计', input)], action: '应用',
        onSubmit() {
          const subtotal = parseNumber(input.value, { maxInteger: 60, maxFraction: 2 * precision });
          if (!subtotal) {
            dialogError.textContent = '请输入有效的小计金额。';
            return;
          }
          const computed = asText(divideRounded(asFixed(subtotal, 2 * precision), priceValue), precision);
          const formatted = formatNumber(computed);
          if (parseNumber(formatted) === null) {
            dialogError.textContent = '反算出的数量超出输入范围。';
            return;
          }
          quantity.value = formatted;
          calculate();
          dialog.close();
        }
      });
    }

    function validateDraft(message) {
      const invalid = rowsElement.querySelector('[aria-invalid="true"]');
      if (!invalid) return true;
      announce(message);
      invalid.focus();
      return false;
    }

    function saveDraft(name, entries) {
      const records = [...data.records];
      const index = records.findIndex((record) => record.name === name);
      const record = { name, rows: entries };
      if (index < 0) records.push(record);
      else records[index] = record;
      if (!persist({ ...data, records })) return false;
      activeName = name;
      refreshSaved();
      announce(`已保存「${name}」。`);
      return true;
    }

    function saveCurrent({ asNew = false, afterSave } = {}) {
      const message = '请先修正标红的数值。';
      if (!validateDraft(message)) {
        if (dialog.open) dialogError.textContent = message;
        return;
      }
      const entries = readRows();
      function finish(name) {
        if (!saveDraft(name, entries)) return;
        if (dialog.open) dialog.close();
        afterSave?.();
      }
      if (activeName && !asNew) {
        finish(activeName);
        return;
      }
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 80;
      input.placeholder = '例如：第一笔持仓';
      openDialog({
        title: '另存为', body: [field('记录名称', input)], action: '保存',
        onSubmit() {
          const name = input.value.trim();
          if (!name || recordFor(name)) {
            dialogError.textContent = name ? '这个名称已存在，请使用其他名称。' : '请输入记录名称。';
            input.focus();
            return;
          }
          finish(name);
        }
      });
    }

    function switchRecord(name) {
      savedSelect.value = activeName;
      if (name === activeName) return;
      const stored = recordFor()?.rows;
      const draft = readRows();
      const changed = stored ? JSON.stringify(stored) !== JSON.stringify(draft)
        : draft.some(({ price, quantity }) => price !== '' || quantity !== '');
      if (!changed) {
        loadRecord(name);
        return;
      }
      function discard() {
        dialog.close();
        loadRecord(name);
      }
      openDialog({
        title: '当前内容尚未保存', body: [paragraph('切换记录前，可以先保存当前输入。')],
        action: '先保存', onSubmit: () => saveCurrent({ afterSave: () => loadRecord(name) }),
        secondary: '放弃修改', onSecondary: discard
      });
    }

    byId('settings').addEventListener('click', () => {
      if (!validateDraft('请先修正标红的数值，再调整记数法。')) return;
      const symbols = document.createElement('select');
      for (const [code, label] of currencyOptions) symbols.add(new Option(label, code));
      symbols.value = data.prefs.currency;
      const formats = document.createElement('select');
      for (const [code, format] of Object.entries(numberFormats)) formats.add(new Option(format.label, code));
      formats.value = data.prefs.format;
      const preview = paragraph('');
      const selected = () => ({ currency: symbols.value, format: formats.value });
      const showPreview = () => { preview.textContent = `预览 ${formatMoney('1234567.89', selected())}`; };
      for (const select of [symbols, formats]) select.addEventListener('change', showPreview);
      showPreview();
      openDialog({
        title: '货币设置', body: [field('货币符号', symbols), field('记数法', formats), preview], action: '保存',
        onSubmit() {
          const entries = readRows();
          if (!persist({ ...data, prefs: selected() })) return;
          entries.forEach((entry, index) => {
            for (const input of rowInputs(rowsElement.rows[index])) {
              input.value = formatNumber(entry[input.dataset.field]);
            }
          });
          updateUnits();
          calculate();
          dialog.close();
        }
      });
    });

    function updateUnits() {
      for (const el of document.querySelectorAll('.currency-unit')) el.textContent = `(${unit()})`;
    }

    byId('new').addEventListener('click', () => {
      if (activeName) {
        switchRecord('');
        return;
      }
      const draft = readRows();
      if (!draft.some(({ price, quantity }) => price !== '' || quantity !== '')) {
        loadRecord();
        return;
      }
      openDialog({
        title: '新建记录', body: [paragraph('当前内容尚未保存。')], action: '保存后新建',
        onSubmit: () => saveCurrent({ afterSave: () => loadRecord() }),
        secondary: '直接新建', onSecondary() { dialog.close(); loadRecord(); }
      });
    });

    byId('save').addEventListener('click', () => saveCurrent());
    byId('save-as').addEventListener('click', () => saveCurrent({ asNew: true }));
    byId('reset').addEventListener('click', () => {
      const name = activeName;
      loadRecord(name);
      announce(name ? '已恢复上次保存的内容。' : '已清空输入。');
    });
    savedSelect.addEventListener('change', () => switchRecord(savedSelect.value));

    byId('delete').addEventListener('click', () => {
      const name = activeName;
      openDialog({
        title: '删除记录', body: [paragraph(`确定删除「${name}」吗？`)], action: '删除',
        onSubmit() {
          const records = data.records.filter((record) => record.name !== name);
          if (!persist({ ...data, records })) return;
          dialog.close();
          loadRecord(records[0]?.name);
          announce(`已删除「${name}」。`);
        }
      });
    });

    byId('order').addEventListener('click', () => {
      const records = [...data.records];
      const list = document.createElement('ol');
      list.className = 'order-list';
      function render(focusIndex, focusDirection) {
        list.replaceChildren();
        records.forEach(({ name }, index) => {
          const item = document.createElement('li');
          const label = document.createElement('span');
          label.textContent = name;
          item.append(label);
          for (const [direction, text] of [[-1, '上移'], [1, '下移']]) {
            const destination = index + direction;
            const button = document.createElement('button');
            button.className = 'button';
            button.type = 'button';
            button.textContent = text;
            button.setAttribute('aria-label', `${text}「${name}」`);
            button.disabled = destination < 0 || destination >= records.length;
            button.addEventListener('click', () => {
              [records[index], records[destination]] = [records[destination], records[index]];
              render(destination, direction);
            });
            item.append(button);
          }
          list.append(item);
        });
        if (focusIndex !== undefined) {
          const buttons = list.children[focusIndex].querySelectorAll('button');
          const wanted = buttons[focusDirection < 0 ? 0 : 1];
          (wanted.disabled ? Array.from(buttons).find((button) => !button.disabled) : wanted)?.focus();
        }
      }
      render();
      openDialog({
        title: '调整顺序', body: [list], action: '保存',
        onSubmit() {
          if (!persist({ ...data, records })) return;
          refreshSaved();
          dialog.close();
          announce('已保存记录顺序。');
        }
      });
    });

    byId('export').addEventListener('click', () => {
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.json,application/json';
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;
        try {
          const backup = JSON.parse(await file.text());
          if (!dialog.open || !dialogContent.contains(fileInput)) return;
          if (backup.version !== 1 || !validateRecords(backup.records)) throw new Error('Invalid backup');
          const existing = new Set(data.records.map((record) => record.name));
          const imported = backup.records.filter((record) => !existing.has(record.name));
          if (!persist({ ...data, records: [...data.records, ...imported] })) return;
          refreshSaved();
          dialog.close();
          announce(`已导入 ${imported.length} 条记录，跳过 ${backup.records.length - imported.length} 条同名记录。`);
        } catch {
          if (dialogContent.contains(fileInput)) dialogError.textContent = '无法读取此备份，请选择计算器导出的 JSON 文件。';
          fileInput.value = '';
        }
      });
      openDialog({
        title: '导出备份', body: [paragraph('把已保存的记录下载为 JSON，也可从备份导入记录。'), field('导入备份（跳过同名记录）', fileInput)],
        action: '下载备份', onSubmit() {
          const backup = JSON.stringify({ version: 1, records: data.records }, null, 2);
          const url = URL.createObjectURL(new Blob([backup], { type: 'application/json' }));
          const link = document.createElement('a');
          link.href = url;
          link.download = '股票平均价格计算器-备份.json';
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          dialog.close();
          announce('已下载备份。');
        }
      });
    });

    byId('dialog-form').addEventListener('submit', (event) => {
      event.preventDefault();
      submitDialog();
    });
    byId('dialog-cancel').addEventListener('click', () => dialog.close());
    document.addEventListener('click', (event) => {
      if (!menu.contains(event.target) || event.target.closest('.popover button')) menu.open = false;
    });
    menu.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && menu.open) {
        menu.open = false;
        menu.querySelector('summary').focus();
      }
    });
    rowsElement.addEventListener('input', () => {
      announce('');
      calculate();
    });
    rowsElement.addEventListener('focusout', (event) => {
      const input = event.target;
      if (!input.matches('.number')) return;
      const parsed = parseNumber(input.value);
      if (parsed !== null) input.value = formatNumber(parsed);
    });
    rowsElement.addEventListener('click', (event) => {
      const subtotal = event.target.closest('.subtotal-edit');
      if (subtotal && !subtotal.hidden) {
        editSubtotal(subtotal);
        return;
      }
      const remove = event.target.closest('.remove');
      if (!remove) return;
      const row = remove.closest('tr');
      const next = row.nextElementSibling || row.previousElementSibling;
      row.remove();
      labelRows();
      calculate();
      rowInputs(next)[0].focus();
    });
    byId('add').addEventListener('click', () => {
      const row = appendRow();
      labelRows();
      rowInputs(row)[0].focus();
    });

    updateUnits();
    loadRecord(data.records[0]?.name);
    if (!storageAvailable) announce('本地存储不可用，仍可使用计算功能。');
  </script>
</body>
</html>
